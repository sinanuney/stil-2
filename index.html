<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stil Fotoğrafçılık | Nazilli</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <meta name="description"
        content="Nazilli'de düğün, nişan ve özel gün organizasyonları için Selahattin Acar Düğün Salonu ve Stil Fotoğrafçılık hizmetleri. Profesyonel çekim ve modern salon deneyimi.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>

<body>
    <!-- Back Button -->


    <div class="container">
        <div class="card" onclick="window.location.href='salon.html'">
            <img src="images/1.jpg" alt="Salon" class="card-image">
            <div class="card-overlay">
                <h2>Salon</h2>
            </div>
            <div class="social-icons">
                <a href="https://www.instagram.com/selahattin.acar.dugun.salonu/" class="social-icon instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://wa.me/905544126197" class="social-icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
            <div class="card-arrow">
                <i class="fas fa-chevron-up"></i>
            </div>
        </div>
        <div class="card" onclick="window.location.href='stil.html'">
            <img src="images/2.jpg" alt="Stil" class="card-image">
            <div class="card-overlay">
                <h2>Stil</h2>
            </div>
            <div class="social-icons">
                <a href="https://www.instagram.com/stilfotografcilik09/" class="social-icon instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://wa.me/905543913378" class="social-icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
            <div class="card-arrow">
                <i class="fas fa-chevron-up"></i>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const angleX = ((y - centerY) / 10) * -1;
                const angleY = (x - centerX) / 10;

                card.style.transform = `perspective(1000px) rotateX(${angleX}deg) rotateY(${angleY}deg) scale(1.05)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });
        });
    </script>
    <script src="js/back-button.js"></script>
</body>

</html>
